plugins { id 'com.android.application' }

android {
    namespace 'com.shadowplay.launcher'
    compileSdk 35
    defaultConfig {
        applicationId 'com.shadowplay.launcher'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    buildTypes {
        release { minifyEnabled false; shrinkResources false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
        debug { minifyEnabled false }
    }
    java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
}
